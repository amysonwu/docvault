<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档分享 · DocVault</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand-dark:#1d4ed8;--bg:#f1f5f9;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:12px 14px 16px;display:flex;justify-content:center;align-items:flex-start}
.wrap{width:1360px;max-width:100%;height:calc(100vh - 28px);display:flex}
.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow:hidden;display:flex;flex-direction:column;width:100%;min-height:0}
.head{flex:0 0 auto;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.brand{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);font-size:11px;vertical-align:middle;margin-right:8px}
.brand .logo{width:16px;height:16px;border-radius:4px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px}
h1{font-size:15px;font-weight:700;word-break:break-all;line-height:1.4;display:inline;vertical-align:middle}
.hd-right{display:flex;gap:8px;align-items:center;flex:0 0 auto}
button{border:0;border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
button:hover{background:var(--brand-dark)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eff6ff;color:var(--brand);white-space:nowrap}
.tag.ro{background:#fef9ec;color:#b45309}
.body{flex:1 1 auto;min-height:0;overflow:auto;padding:32px 46px 52px;line-height:1.85;font-size:14.5px;scroll-behavior:smooth}
/* 保真预览（PDF 原生渲染） */
.body:has(.pv-frame){padding:0;overflow:hidden}
.body:has(.pv-wrap){padding:0;display:flex;align-items:flex-start;justify-content:center}
.pv-frame{width:100%;height:100%;border:0;display:block;background:#eef1f5}
.pv-wrap{display:flex;justify-content:center;padding:20px;width:100%}
.pv-img{max-width:100%;box-shadow:0 2px 14px rgba(15,23,42,.14);border-radius:4px}
/* 平铺水印层：覆盖全部预览形态（文字/图片/PDF），与站内预览一致 */
.content-wrap{flex:1 1 auto;min-height:0;position:relative;display:flex;overflow:hidden}
.wm-layer{position:absolute;inset:-25%;pointer-events:none;display:flex;flex-wrap:wrap;
  align-content:center;justify-content:center;gap:70px 110px;transform:rotate(-26deg);opacity:.09;z-index:5}
.wm-layer span{font-size:13px;color:#0f172a;white-space:nowrap;font-weight:600;letter-spacing:.05em}
.body .loading,.body .muted{color:var(--muted);font-size:13.5px}
/* 文档内容样式（md / 富文本预览） */
.doc{max-width:920px;margin:0 auto;color:#1e293b;font-size:15px;line-height:1.92;letter-spacing:.002em}
.doc h1,.doc h2,.doc h3,.doc h4{color:#0f172a;font-weight:700;letter-spacing:-.012em;line-height:1.38}
.doc h1{font-size:26px;margin:6px 0 18px;padding-bottom:14px;border-bottom:1px solid #e8edf3}
.doc h2{font-size:19px;margin:34px 0 12px;padding-left:11px;border-left:3px solid var(--brand)}
.doc h3{font-size:16.5px;margin:26px 0 9px;color:#334155}
.doc h4{font-size:15px;margin:20px 0 7px}
.doc h1:first-child,.doc h2:first-child,.doc h3:first-child{margin-top:0}
.doc p{margin:0 0 1.05em;color:#334155}
.doc strong{color:#0f172a;font-weight:650}
.doc a{color:var(--brand);text-decoration:none;border-bottom:1px solid rgba(37,99,235,.35)}
.doc a:hover{border-bottom-color:var(--brand)}
.doc ul,.doc ol{margin:.5em 0 1.1em;padding-left:1.6em}
.doc li{margin:.34em 0;color:#334155}
.doc li::marker{color:#94a3b8}
.doc blockquote{margin:18px 0;padding:12px 18px;background:#f6f9fd;border-left:3px solid #bfdbfe;border-radius:0 8px 8px 0;color:#475569}
.doc blockquote p:last-child{margin-bottom:0}
.doc hr{border:0;border-top:1px solid #e8edf3;margin:30px 0}
.doc table{border-collapse:separate;border-spacing:0;margin:18px 0;width:100%;font-size:13.8px;
  border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.doc th,.doc td{border-bottom:1px solid #edf1f6;padding:10px 14px;text-align:left;vertical-align:top}
.doc th{background:#f7f9fc;font-weight:650;color:#334155;border-bottom:1px solid #e2e8f0}
.doc tr:last-child td{border-bottom:0}
.doc tbody tr:nth-child(even) td{background:#fcfdfe}
.doc code{font-family:Consolas,"Courier New",monospace;font-size:.88em;background:#f1f5f9;color:#b91c1c;
  padding:1.5px 6px;border-radius:5px}
.doc pre,.doc .pre-wrap{white-space:pre-wrap;word-break:break-word;font-family:Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.75;background:#f8fafc;border:1px solid #e8edf3;border-radius:10px;
  padding:16px 18px;overflow:auto;color:#334155;margin:16px 0}
.doc pre code{background:none;color:inherit;padding:0;font-size:inherit}
.doc img{max-width:100%;border-radius:8px;box-shadow:0 2px 12px rgba(15,23,42,.08)}
.doc .slide{border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:16px 0;background:#fcfdff}
.doc .slide-no{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.doc .page-sep{border:0;border-top:1px dashed var(--line);margin:22px 0}

/* 密码框 */
.pw-box{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 34px 46px;text-align:center}
.pw-box .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.7}
.pw-box .field{display:flex;gap:8px;max-width:380px;margin:0 auto}
input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:14px;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.msg{font-size:13px;margin:14px auto 0;padding:9px 13px;border-radius:8px;max-width:380px;display:none}
.msg.err{display:block;background:#fef2f2;color:var(--err)}
.dead{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 34px;text-align:center}
.dead h1{font-size:18px;margin-bottom:8px}
.dead .sub{color:var(--muted);font-size:13.5px}
.foot{flex:0 0 auto;padding:6px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <span class="brand"><span class="logo">DV</span>站外分享</span><h1 id="title">正在加载…</h1>
      </div>
      <div class="hd-right" id="hdRight"></div>
    </div>

    <div id="pwBox" class="pw-box" style="display:none">
      <div class="sub">该分享受密码保护，请输入密码查看文档内容</div>
      <div class="field">
        <input id="pw" type="password" placeholder="分享密码" autocomplete="off">
        <button onclick="openDoc()">查看</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>

    <div class="content-wrap">
      <div id="content" class="body"><div class="loading">正在加载文档内容…</div></div>
      <div class="wm-layer" aria-hidden="true">
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
        <span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span><span>内部资料 · 请勿外传</span>
      </div>
    </div>

    <div class="foot" id="foot" style="display:none">
      <span id="footLeft"></span>
      <span>由 DocVault 智档提供 · 请勿外传</span>
    </div>
  </div>
</div>
<script>
const token = location.pathname.split("/").pop();
const $ = id => document.getElementById(id);
let pw = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dead(title, text){
  $("pwBox").style.display = "none";
  $("content").innerHTML = `<div class="dead"><h1>${esc(title)}</h1><div class="sub">${esc(text)}</div></div>`;
  $("title").textContent = "无法打开分享";
  $("hdRight").innerHTML = "";
  $("foot").style.display = "none";
}

async function load(){
  // 先拿基础信息，决定是否要密码
  const r = await fetch(`/api/guest/${token}/info`).catch(() => null);
  if(!r) return dead("网络错误", "请检查网络后重试");
  if(r.status === 404) return dead("分享不存在或已被撤销", "请联系分享者重新生成链接");
  if(r.status === 410) return dead("分享链接已过期", "请联系分享者重新生成链接");
  if(!r.ok) return dead("加载失败", "服务返回 " + r.status);
  const info = await r.json();
  if(info.has_password){
    $("title").textContent = info.name;
    $("content").innerHTML = `<div class="muted">输入密码后即可查看文档内容。</div>`;
    $("pwBox").style.display = "block";
    $("pw").focus();
    return;
  }
  await showContent();
}

async function openDoc(){
  pw = $("pw").value;
  $("msg").className = "msg";
  await showContent();
}

async function showContent(){
  const q = pw ? `?password=${encodeURIComponent(pw)}` : "";
  const r = await fetch(`/api/guest/${token}/content${q}`);
  if(r.status === 401){ $("msg").textContent = "分享密码错误"; $("msg").className = "msg err"; return; }
  if(r.status === 404 || r.status === 410) return dead("分享不存在、已撤销或已过期", "请联系分享者重新生成链接");
  if(r.status === 415){
    const d = await r.json().catch(() => ({}));
    $("pwBox").style.display = "none";
    $("content").innerHTML = `<div class="dead"><h1>该格式暂不支持在线预览</h1><div class="sub">${esc(d.detail || "")}</div></div>`;
    return;
  }
  if(!r.ok){ $("msg").textContent = "加载失败（" + r.status + "）"; $("msg").className = "msg err"; return; }
  const d = await r.json();

  $("pwBox").style.display = "none";
  $("title").textContent = d.name;
  $("hdRight").innerHTML =
    `<span class="tag">v${d.seq}</span>` +
    (d.view_only ? `<span class="tag ro">仅在线预览</span>` : `<button onclick="download()">⬇ 下载</button>`);
  $("foot").style.display = "flex";
  $("footLeft").textContent = `当前版本 v${d.seq}${d.view_only ? " · 仅预览模式" : ""}`;

  const c = $("content");
  const ext = (d.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
  const office = [".docx",".doc",".pptx",".ppt",".xlsx",".xls",".pdf",".rtf",".odt",".odp",".ods"].includes(ext);
  const image = [".png",".jpg",".jpeg",".gif"].includes(ext);
  if(office || image){
    // 保真预览：Office/PDF 由服务端转 PDF 后交给浏览器原生阅读器
    const q2 = pw ? `?password=${encodeURIComponent(pw)}` : "";
    const renderUrl = `/api/guest/${token}/render${q2}`;
    try {
      const rr = await fetch(renderUrl);
      if(rr.ok){
        if(image){
          const blob = await rr.blob();
          c.innerHTML = `<div class="pv-wrap"><img src="${URL.createObjectURL(blob)}" class="pv-img" alt=""></div>`;
        }else{
          const viewer = `/pdf-viewer.html?src=${encodeURIComponent(renderUrl)}`
            + `&wm=${encodeURIComponent("内部资料 · 请勿外传")}`;
          c.innerHTML = `<iframe class="pv-frame" src="${viewer}" title="文档预览" allow="fullscreen" allowfullscreen></iframe>`;
        }
        c.scrollTop = 0;
        return;
      }
    } catch(_){}
  }
  if(d.kind === "text"){
    c.innerHTML = `<div class="doc"><pre class="pre-wrap">${esc(d.content)}</pre></div>`;
  }else{
    c.innerHTML = `<div class="doc">${d.content}</div>`;
  }
  c.scrollTop = 0;
}

function download(){
  const u = `/api/guest/${token}/download` + (pw ? `?password=${encodeURIComponent(pw)}` : "");
  const a = document.createElement("a");
  a.href = u; a.download = ""; a.click();
}

load();
</script>
</body>
</html>
