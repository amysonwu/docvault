name: ✨ 功能建议
description: 提出新能力或改进点（先对齐场景，再谈实现）
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        好的功能建议从**场景**开始，而不是从界面开始。
        如果这条建议与 [路线图](../blob/main/docs/ROADMAP.md) 中的某项重合，请直接说「对应 v0.x 的某条」，方便关联。

  - type: textarea
    id: scenario
    attributes:
      label: 场景与痛点
      description: 谁在什么情况下遇到什么麻烦？现在是怎么绕过去的？
      placeholder: |
        我们的测评报告要出 5 个版本给不同甲方，
        现在只能复制成 5 份文档分别维护，改一处要重复改 5 次……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的能力
      description: 描述你希望达到的效果，不必给技术方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现成的其它软件怎么做的？为什么不合适？
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 对你而言的优先级
      options:
        - 阻塞我们上线
        - 很影响效率，但能绕
        - 锦上添花
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私前提
      description: 本项目坚持「所有能力可内网运行」
      options:
        - label: 我理解并接受：该功能若引入外部服务，必须提供本地/内网替代方案
          required: true
