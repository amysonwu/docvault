<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="智档 DocVault">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101c33"/>
      <stop offset="1" stop-color="#132a4d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1090" cy="34" r="150" fill="#2563eb" opacity="0.10"/>
  <circle cx="1010" cy="270" r="110" fill="#38bdf8" opacity="0.08"/>

  <!-- 品牌标记：书脊 + 斜放的书 -->
  <g transform="translate(72,96) scale(4.4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.15" y="4.3" width="3.1" height="15.4" rx="1.55" fill="url(#bar)" stroke="none"/>
    <path d="M12.1 6.3 16.4 5.1l2.9 13.4-4.3 1.2z" stroke="url(#fade)" stroke-width="1.7"/>
  </g>

  <text x="196" y="146" fill="#f8fafc" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"
        font-size="62" font-weight="700" letter-spacing="2">智档 DocVault</text>
  <text x="198" y="192" fill="#94a3b8" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"
        font-size="22" letter-spacing="1.2">私有部署的一体化文档管理 · 版本溯源 · 在线协同</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#cbd5e1">
    <rect x="198" y="216" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="216" y="238">数据不出内网</text>
    <rect x="342" y="216" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="360" y="238">全程审计</text>
    <rect x="472" y="216" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="490" y="238">版本级权限内核</text>
    <rect x="634" y="216" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="652" y="238">AGPL · 可自建</text>
  </g>
</svg>
