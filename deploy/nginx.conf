# DocVault 单端口入口# DocVault 单端口入口：/ → 应用，OnlyOffice 前缀 → 文档服务器
# 同源部署，浏览器只需要访问 10001 一个端口（编辑器不再暴露额外端口）
server {
    listen 80;
    server_name _;

    client_max_body_size 512m;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # ---------- OnlyOffice（含协同编辑 WebSocket /doc/） ----------
    location ~ ^/(?:[0-9][\w.\-]*/)?(web-apps|sdkjs|fonts|themes|cache|doc|coauthoring|hosting|download|media|info|healthcheck|example)(/|$) {
        proxy_pass http://oo:80;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

    }

    # ---------- 应用 ----------
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
